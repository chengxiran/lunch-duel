<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="用连续二选一帮你决定今天吃什么。" />
    <title>午餐对决 · 今天吃什么？</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">LUNCH DECIDER · 01</p>
        <h1>午餐对决</h1>
        <p class="subtitle">别再纠结。选出更想吃的那一个，让下一轮帮你缩小范围。</p>
      </header>

      <section id="setup" class="panel setup-panel" aria-labelledby="setup-title">
        <div class="panel-heading">
          <p class="step">步骤 1 / 2</p>
          <h2 id="setup-title">先放入候选午餐</h2>
          <p>输入 2–8 个选项，用逗号、顿号或换行隔开。</p>
        </div>
        <label for="food-input">你的候选项</label>
        <textarea id="food-input" rows="5" placeholder="例如：&#10;兰州拉面、麻辣烫、海南鸡饭、寿司"></textarea>
        <div class="setup-actions">
          <button id="example-btn" class="text-button" type="button">填入示例</button>
          <button id="start-btn" class="primary-button" type="button">开始对决 <span aria-hidden="true">→</span></button>
        </div>
        <p id="setup-error" class="error-message" role="alert" aria-live="polite"></p>
      </section>

      <section id="duel" class="panel duel-panel is-hidden" aria-labelledby="duel-title">
        <div class="duel-topline">
          <div>
            <p class="step">步骤 2 / 2</p>
            <h2 id="duel-title">这一轮，更想吃哪一个？</h2>
          </div>
          <p id="round-label" class="round-label" aria-live="polite"></p>
        </div>
        <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
        <p class="duel-hint">不用想太久——凭第一反应选。</p>
        <div class="food-cards" role="group" aria-label="选择一份午餐">
          <button id="option-a" class="food-card coral" type="button"></button>
          <span class="versus" aria-hidden="true">VS</span>
          <button id="option-b" class="food-card blue" type="button"></button>
        </div>
        <p id="duel-error" class="error-message" role="alert" aria-live="polite"></p>
        <button id="restart-from-duel" class="text-button restart" type="button">← 重新输入候选项</button>
      </section>

      <section id="result" class="panel result-panel is-hidden" aria-labelledby="result-title">
        <p class="eyebrow">THE WINNER IS</p>
        <p class="winner-emoji" aria-hidden="true">🍽️</p>
        <h2 id="result-title"></h2>
        <p id="result-reason" class="result-copy"></p>
        <div class="result-actions">
          <button id="again-btn" class="primary-button" type="button">再来一局 <span aria-hidden="true">↻</span></button>
          <button id="new-list-btn" class="text-button" type="button">换一组候选项</button>
        </div>
      </section>

      <aside class="tip" aria-label="使用提示">
        <span aria-hidden="true">✦</span> 两个选项不分上下？选你现在最愿意下楼去买的那个。
      </aside>
    </main>
    <script src="script.js"></script>
  </body>
</html>
